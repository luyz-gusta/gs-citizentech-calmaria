<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Calmaria: diagrama da arquitetura 1920 x 1080</title>
<link rel="stylesheet" href="base.css">
<style>
body { width: 1920px; height: 1080px; overflow: hidden; position: relative; background: var(--superficie); color: var(--texto); }
h1 { position: absolute; left: 96px; top: 54px; margin: 0; font-size: 48px; line-height: 1.2; font-weight: 700; }
h1 small { display: block; font-size: 32px; font-weight: 400; color: var(--apoio); margin-top: 6px; }
svg.d { position: absolute; left: 96px; top: 210px; width: 1728px; height: auto; }
.b { fill: #F8FBFD; stroke: #6B737A; stroke-width: 1.5; }
.api { fill: #E7EEF3; stroke: #3D5A73; stroke-width: 1.5; }
.mod { fill: #F8FBFD; stroke: #3D5A73; stroke-width: 1.5; }
.vm { fill: none; stroke: #6B737A; stroke-width: 1.5; stroke-dasharray: 6 5; }
.t { font-family: var(--texto-font); font-size: 16px; font-weight: 700; fill: #14191F; }
.s { font-family: var(--texto-font); font-size: 13px; fill: #4D545B; }
.a { stroke: #14191F; stroke-width: 1.5; fill: none; }
.al { font-family: var(--mono-font); font-size: 12px; fill: #3D5A73; }
.ponta { fill: #14191F; }
</style>
</head>
<body>
<h1>Arquitetura da Calmaria<small>Uma API em C# com três módulos, o sensor, o app e o modelo de ML</small></h1>
<svg class="d" viewBox="0 0 1000 460" role="img" aria-label="Arquitetura da Calmaria">
  <defs><marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ponta" d="M0 0 10 5 0 10z"/></marker></defs>
  <rect class="vm" x="250" y="20" width="520" height="420" rx="14"/>
  <text class="s" x="268" y="46">VM Ubuntu · systemd · nginx (Operating Systems)</text>
  <rect class="b" x="20" y="14" width="180" height="72" rx="10"/><text class="t" x="38" y="44">Sensor ESP32</text><text class="s" x="38" y="68">Wokwi · som, luz, PIR</text>
  <rect class="b" x="20" y="118" width="180" height="72" rx="10"/><text class="t" x="38" y="148">Broker MQTT</text><text class="s" x="38" y="172">broker.hivemq.com</text>
  <rect class="b" x="20" y="330" width="180" height="76" rx="10"/><text class="t" x="38" y="362">Notebook de ML</text><text class="s" x="38" y="386">SP156 · previsões</text>
  <rect class="api" x="280" y="64" width="300" height="352" rx="12"/><text class="t" x="298" y="94">API Calmaria</text><text class="s" x="420" y="94">.NET 10 · EF Core</text>
  <rect class="mod" x="300" y="112" width="260" height="84" rx="10"/><text class="t" x="318" y="146">Sensorial</text><text class="s" x="318" y="170">lugares, leituras, ISS, crise</text>
  <rect class="mod" x="300" y="214" width="260" height="84" rx="10"/><text class="t" x="318" y="248">Comunidade</text><text class="s" x="318" y="272">usuário anônimo, perfil, relatos</text>
  <rect class="mod" x="300" y="316" width="260" height="84" rx="10"/><text class="t" x="318" y="350">Privacidade</text><text class="s" x="318" y="374">PII, taint, Risco Cidadão</text>
  <rect class="b" x="610" y="200" width="140" height="84" rx="10"/><text class="t" x="628" y="234">PostgreSQL</text><text class="s" x="628" y="258">Npgsql</text>
  <rect class="b" x="800" y="60" width="180" height="84" rx="10"/><text class="t" x="818" y="94">App Calmaria</text><text class="s" x="818" y="118">Expo · SQLite</text>
  <rect class="b" x="800" y="320" width="180" height="84" rx="10"/><text class="t" x="818" y="354">LLM externo</text><text class="s" x="818" y="378">tradução do alerta</text>
  <path class="a" d="M110 86 V118" marker-end="url(#seta)"/><text class="al" x="118" y="107">publica</text>
  <path class="a" d="M200 154 H300" marker-end="url(#seta)"/><text class="al" x="210" y="146">MQTT</text>
  <path class="a" d="M200 368 H280" marker-end="url(#seta)"/><text class="al" x="210" y="360">CSV</text>
  <path class="a" d="M800 102 H580" marker-start="url(#seta)" marker-end="url(#seta)"/><text class="al" x="660" y="94">REST</text>
  <path class="a" d="M580 242 H610" marker-end="url(#seta)"/>
  <path class="a" d="M560 358 H800" marker-end="url(#seta)"/><text class="al" x="660" y="350">REST</text>
</svg>
</body>
</html>
